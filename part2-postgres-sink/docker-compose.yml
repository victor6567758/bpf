services:
  postgres:
    image: postgres:16
    container_name: bpf-postgres
    restart: unless-stopped
    network_mode: host
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-packets}
      POSTGRES_USER: ${POSTGRES_USER:-packets}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-packets}
      POSTGRES_HOST_SSL_METHOD: disable
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-packets} -d ${POSTGRES_DB:-packets}"]
      interval: 5s
      timeout: 3s
      retries: 10
    logging:
      options:
        max-size: "10m"
        max-file: "3"

  capture:
    build:
      context: .
      dockerfile: Dockerfile.core
    image: bpf-pg-capture
    container_name: bpf-pg-capture
    depends_on:
      postgres:
        condition: service_healthy
    privileged: true
    network_mode: host
    stop_grace_period: 5s
    init: true
    volumes:
      - /sys/kernel/debug:/sys/kernel/debug:ro
      - /sys/fs/bpf:/sys/fs/bpf
      - ./output:/work/output
    environment:
      IFACE: "lo"
      LOG: "/work/output/pg_capture.pcap"
      PG_HOST: "127.0.0.1"
      PG_PORT: "5432"
      PG_USER: "${POSTGRES_USER:-packets}"
      PG_DB: "${POSTGRES_DB:-packets}"
      PG_PASSWORD: "${POSTGRES_PASSWORD:-packets}"
      EXIT_AFTER_PROBE: "0"
      HOST_UID: "${HOST_UID:-1000}"
      HOST_GID: "${HOST_GID:-1000}"
    logging:
      options:
        max-size: "10m"
        max-file: "3"

  wireshark:
    build:
      context: .
      dockerfile: Dockerfile.wireshark
    image: bpf-pg-wireshark
    container_name: bpf-pg-wireshark
    depends_on:
      postgres:
        condition: service_healthy
    init: true
    stop_grace_period: 5s
    volumes:
      - ./output:/work/output
    environment:
      OUT_DIR: "/work/output"
      CAPTURE_FILE: "/work/output/pg_capture.pcap"
      DECODED_FILE: "/work/output/pg_decoded.txt"
      HOST_UID: "${HOST_UID:-1000}"
      HOST_GID: "${HOST_GID:-1000}"
    logging:
      options:
        max-size: "10m"
        max-file: "3"

  db-client:
    image: postgres:16
    container_name: bpf-pg-db-client
    depends_on:
      postgres:
        condition: service_healthy
    network_mode: host
    environment:
      PGHOST: "127.0.0.1"
      PGPORT: "5432"
      PGUSER: "${POSTGRES_USER:-packets}"
      PGDATABASE: "${POSTGRES_DB:-packets}"
      PGPASSWORD: "${POSTGRES_PASSWORD:-packets}"

    command: >
      psql -v ON_ERROR_STOP=1 -c "SELECT 'db-client start', now();"
           -c "CREATE TABLE IF NOT EXISTS demo (id serial PRIMARY KEY, note text, ts timestamptz DEFAULT now());"
           -c "INSERT INTO demo (note) VALUES ('hello from db-client'), ('another row'), ('third');"
           -c "SELECT id, note, ts FROM demo ORDER BY id DESC LIMIT 5;"
           -c "SELECT count(*) AS total FROM demo;"
           -c "SELECT 'db-client done', now();"
    profiles: ["manual"]

volumes:
  pgdata:
    name: bpf-postgres-data
