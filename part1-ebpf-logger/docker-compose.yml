services:
  packet-logger:
    build:
      context: .
      dockerfile: Dockerfile.core
    container_name: ebpf-packet-logger
    privileged: true
    network_mode: host
    stop_grace_period: 5s
    init: true
    volumes:
      - /sys/kernel/debug:/sys/kernel/debug:ro
      - /sys/fs/bpf:/sys/fs/bpf
      - ./output:/work/output
      - ./scripts:/work/scripts
      - ./src:/work/src
      - ./bpf:/work/bpf
    environment:
      VETH0: "veth0"
      VETH1: "veth1"
      VETH0_IP: "10.0.0.1/24"
      VETH1_IP: "10.0.0.2/24"
      VETH0_IP_NO_MASK: "10.0.0.1"
      VETH1_IP_NO_MASK: "10.0.0.2"
      PEER_NS: "bpfpeer"
      TEST_ON_START: "1"
      EXIT_AFTER_TEST: "0"
      LOG: "/work/output/packets.log"
      HOST_UID: "${HOST_UID:-1000}"
      HOST_GID: "${HOST_GID:-1000}"

  wireshark:
    build:
      context: .
      dockerfile: Dockerfile.wireshark
    container_name: ebpf-wireshark
    depends_on:
      - packet-logger
    network_mode: host
    cap_add:
      - NET_ADMIN
      - NET_RAW
    init: true
    stop_grace_period: 5s
    volumes:
      - ./output:/work/output
    environment:
      VETH0: "veth0"
      OUT_DIR: "/work/output"
      CAPTURE_FILE: "/work/output/capture.pcap"
      DECODED_FILE: "/work/output/decoded.txt"
      FILTER: ""
      HOST_UID: "${HOST_UID:-1000}"
      HOST_GID: "${HOST_GID:-1000}"
